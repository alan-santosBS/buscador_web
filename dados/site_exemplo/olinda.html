<h1>Olinda</h1>
<p>Olinda tem um centro histórico colonial com igrejas, casarões coloridos e ladeiras, reconhecido como patrimônio da humanidade.</p>
<p>O carnaval de Olinda é famoso pelos bonecos gigantes e pelo frevo tocado nas ruas. Do alto da Sé se vê o mar e a cidade de Recife.</p>
